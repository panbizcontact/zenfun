{% extends "base.html" %}
{% block title %}会員登録｜全墳 ZENFUN{% endblock %}
{% block head %}
<style>
  body { display: grid; place-items: center; padding: 24px; background: var(--paper-2); }
</style>
{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-head">
    <div class="brand"><span class="brand-mark">全墳</span><small>ZENFUN</small></div>
    <p>登録すると、古墳の追加・編集に参加できます。</p>
  </div>
  <div class="auth-body">
    <form method="post">
      <label for="username">ユーザー名</label>
      <input id="username" name="username" value="{{ username or '' }}" required autofocus>
      <div class="hint">3文字以上。編集履歴に表示されます。</div>
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" value="{{ email or '' }}" required>
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" required>
      <div class="hint">8文字以上。</div>
      <button class="auth-btn" type="submit">登録する</button>
    </form>
    <div class="auth-foot">
      すでにアカウントをお持ちの方は <a href="{{ url_for('auth.login') }}">ログイン</a><br>
      <a href="{{ url_for('main.index') }}">← 地図に戻る</a>
    </div>
  </div>
</div>
{% endblock %}
