<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block title %}全墳 ZENFUN{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div id="flash">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash-item {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
  </div>
  {% block content %}{% endblock %}
  <script>
    // Flash を数秒で消す
    setTimeout(function () {
      document.querySelectorAll('#flash .flash-item').forEach(function (e) { e.remove(); });
    }, 3500);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
