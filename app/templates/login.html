{% extends "base.html" %}
{% block title %}ログイン｜全墳 ZENFUN{% endblock %}
{% block head %}
<style>
  body { display: grid; place-items: center; padding: 24px; background: var(--paper-2); }
</style>
{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-head">
    <div class="brand"><span class="brand-mark">全墳</span><small>ZENFUN</small></div>
  </div>
  <div class="auth-body">
    <form method="post">
      <label for="identifier">ユーザー名 または メール</label>
      <input id="identifier" name="identifier" required autofocus>
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" required>
      <button class="auth-btn" type="submit">ログイン</button>
    </form>
    <div class="auth-foot">
      アカウントをお持ちでない方は <a href="{{ url_for('auth.register') }}">会員登録</a><br>
      <a href="{{ url_for('main.index') }}">← 地図に戻る</a>
    </div>
  </div>
</div>
{% endblock %}
